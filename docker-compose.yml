services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      SHADOW_TRADING: "false"
      REAL_MONEY_EXECUTION: "false"
      LEGACY_BROKER_ORDER_ENABLED: "false"
      MT5_MODE: DEMO
    volumes:
      - tradingagents_data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TRADINGAGENTS_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      REAL_MONEY_EXECUTION: "false"
    volumes:
      - tradingagents_data:/data
    depends_on:
      - ollama
    restart: unless-stopped
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
