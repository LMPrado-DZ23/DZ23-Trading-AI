[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.4.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "ccxt>=4.4.0",
    "fastapi>=0.115.0",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "psycopg[binary]>=3.2.0",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "uvicorn>=0.34.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "ccxt>=4.5.0",
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    # Hash de senha do dono (Argon2id) nos testes de autenticação.
    "argon2-cffi>=23.1.0",
    # Leitura de TOML nos testes: stdlib `tomllib` só a partir do 3.11.
    "tomli>=2.0.1; python_version < '3.11'",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]
# Produto completo (painel + banco + corretoras/feed da mesa):
#   pip install "tradingagents[desk]"
desk = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "psycopg[binary]>=3.2.0",
    "ccxt>=4.5.0",
    # Senha do dono guardada como hash Argon2id (nunca em texto puro).
    "argon2-cffi>=23.1.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.uv]
# Pisos de segurança para dependências auditadas pelo CI (pip-audit):
# - urllib3>=2.8.0 corrige PYSEC-2026-4175/4176/4177 (constraint normal;
#   o próprio ccxt 4.5.85 já pinna urllib3==2.8.0).
# - multidict>=6.9.1 corrige CVE-2026-104874. O ccxt >=4.5.65 pinna
#   multidict==6.7.1 exatamente (versão vulnerável), o que forçaria um
#   downgrade de 20 versões do ccxt. Sobrescrevemos só esse pin: multidict
#   6.9.1 é da mesma major 6.x, compatível com aiohttp (>=4.5,<8) e com o
#   uso que o ccxt faz dele (headers via aiohttp). Comportamento é validado
#   pela suíte completa de testes.
constraint-dependencies = [
    "urllib3>=2.8.0",
]
override-dependencies = [
    "multidict>=6.9.1,<7",
]

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "service*"]

[tool.setuptools.package-data]
cli = ["static/*"]
service = ["static/*.html", "static/*.css", "static/*.js", "static/*.webmanifest", "static/marca/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "worklog"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declara dependências como valor padrão (Depends(...)): B008 é falso
# positivo por desenho do framework.
"service/app.py" = ["B008"]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
