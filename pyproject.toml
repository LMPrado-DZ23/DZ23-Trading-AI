[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "1.2.0.dev0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "exchange-calendars>=4.13.2,<5",
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
    "cryptography>=50,<51",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "ccxt==4.5.78",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    "hypothesis>=6.130,<7",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-worker = "service.worker:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "service*"]

[tool.setuptools.package-data]
cli = ["static/*"]
service = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "worklog"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports
"service/app.py" = ["B008"]  # FastAPI dependency injection uses Depends in signatures
"tests/test_security_fase0*.py" = ["C408", "C416", "E701", "E702", "E741", "F401", "I001", "SIM115", "SIM117", "W291"]
"tradingagents/agents/analysts/sentiment_analyst.py" = ["I001"]
"tradingagents/agents/managers/portfolio_manager.py" = ["I001"]
"tradingagents/agents/managers/research_manager.py" = ["I001"]
"tradingagents/agents/risk_mgmt/aggressive_debator.py" = ["I001"]
"tradingagents/agents/risk_mgmt/conservative_debator.py" = ["I001"]
"tradingagents/agents/risk_mgmt/neutral_debator.py" = ["I001"]
"tradingagents/dataflows/redact.py" = ["E402"]  # preserve independently audited Gate A byte layout
"tradingagents/llm_clients/openai_client.py" = ["I001"]

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
