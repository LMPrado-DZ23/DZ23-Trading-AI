name: CI Bisect C (matrix expression)

on:
  push:
    branches: ["feat/diagnostico-ci-20261012"]

jobs:
  bisect-c:
    name: bisect: matrix ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["3.10","3.11","3.12","3.13"]') || fromJSON('["3.12"]') }}
    steps:
      - run: echo "matrix-ok ${{ matrix.python-version }}"
