name: CI

on:
  push:
    branches: [main, unificacao, "feat/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["3.10","3.11","3.12","3.13"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked project with dev extras
        run: uv sync --locked --extra desk --extra dev
      - name: Run test suite
        env:
          OPENAI_BASE_URL: ""
          OPENAI_API_BASE: ""
        run: uv run pytest -q
      - name: Compile application modules
        run: uv run python -m compileall -q tradingagents service scripts

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip wheel
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dev tools
        run: uv sync --locked --extra dev
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: uv run ruff check .

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project and audit tool
        run: |
          uv sync --locked --extra desk
          uv pip install --python .venv/bin/python pip-audit
      - name: Audit installed project dependencies
        run: uv run pip-audit --local --progress-spinner off

  supply-chain:
    name: secrets, licenças e SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks varre o histórico do diff/PR
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project
        run: uv sync --locked --extra desk
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: License inventory — recusar copyleft forte (GPL/AGPL/SSPL/EUPL)
        run: |
          uv pip install --python .venv/bin/python pip-licenses
          uv run pip-licenses --format=csv > /tmp/licenses.csv
          echo "pacotes inventariados: $(($(wc -l < /tmp/licenses.csv) - 1))"
          if grep -Ei 'GPL|SSPL|EUPL' /tmp/licenses.csv | grep -vi 'LGPL'; then
            echo "::error::dependência com licença copyleft forte encontrada"
            exit 1
          fi
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dz23-sbom.spdx.json
      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: dz23-sbom.spdx.json
          retention-days: 90

  smoke:
    name: public smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project
        run: |
          uv sync --locked --extra desk --extra dev
          uv pip install --python .venv/bin/python pyyaml
      - name: Run API and single-owner smoke tests
        run: |
          uv run python scripts/smoke_agency_api.py
          uv run python scripts/smoke_single_owner.py
      - name: Validate compose YAML
        run: uv run python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('docker-compose.yml').read_text())"
