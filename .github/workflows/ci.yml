name: CI

on:
  push:
    branches: [main, unificacao, "feat/**", "release/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && fromJSON('["3.10","3.11","3.12","3.13"]') || fromJSON('["3.12"]') }}
    # Postgres EFÊMERO e EXCLUSIVo deste job (o service container morre com o job).
    # Os fixtures de teste fazem DROP TABLE — por isso o alvo tem de ser
    # descartável: NUNCA um banco real. Só os testes que exigem DZ23_TEST_DATABASE_URL
    # (migração/concorrência) o usam; o resto roda em SQLite/memória.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: dz23test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desk,dev]"
      - name: Typecheck (mypy)
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Run test suite (com PostgreSQL descartável)
        env:
          # DZ23_TEST_DATABASE_URL (dedicada) aponta SÓ para o Postgres efêmero do
          # job — nunca para DATABASE_URL de produção.
          DZ23_TEST_DATABASE_URL: postgresql://postgres:pg@localhost:5432/dz23test
        run: pytest -q
      - name: Compile application modules
        run: python -m compileall -q tradingagents service scripts

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .

  smoke:
    name: public smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desk,dev]"
          pip install pyyaml
      - name: Run API and multi-tenant smoke tests
        run: |
          python scripts/smoke_agency_api.py
          python scripts/smoke_multitenant.py
      - name: Validate compose YAML
        run: python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('docker-compose.yml').read_text())"
