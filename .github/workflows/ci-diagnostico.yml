name: CI Diagnostico Runner

on:
  push:
    branches: ["ci/diagnostico-runner-20261012"]
  workflow_dispatch:

concurrency:
  group: ci-diagnostico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostico:
    name: runner diagnostico (echo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Provar que o runner inicia
        run: |
          echo "runner-ok"
          echo "runner-os: $RUNNER_OS"
          date -u
