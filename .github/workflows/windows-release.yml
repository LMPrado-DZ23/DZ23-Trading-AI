name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - feat/integracao-mestre-20261012

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install locked project (desk + dev extras)
        run: uv sync --extra desk --extra dev
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Executable Bundle
        run: uv run --with pyinstaller python -m desktop.packaging.build_exe
      - name: Compile Inno Setup Installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" desktop/installer/setup.iss'
      - name: Zip Release Bundle and Calculate Hashes
        run: |
          Compress-Archive -Path dist/DZ23-Trading-AI/* -DestinationPath dist/DZ23-Trading-AI-windows-x64.zip
          $linhas = foreach ($f in @("dist/DZ23-Trading-AI-Setup-v0.4.0.exe", "dist/DZ23-Trading-AI-windows-x64.zip")) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          $linhas | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dz23-windows-x64
          path: |
            dist/DZ23-Trading-AI-Setup-v0.4.0.exe
            dist/DZ23-Trading-AI-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    # Publicação de Release só em tag explícita (aprovação humana = criar a tag).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dz23-windows-x64
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DZ23-Trading-AI-Setup-v0.4.0.exe
            dist/DZ23-Trading-AI-windows-x64.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
