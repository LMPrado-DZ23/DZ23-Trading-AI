name: Windows Release Build

# A versão NUNCA é digitada aqui: vem do pyproject.toml (fonte única) e é
# injetada no ISCC (/DAppVersion), nos nomes dos arquivos e no Release.
on:
  push:
    tags:
      - 'v*'
    branches:
      - feat/integracao-mestre-20261012
      - fix/instalador-atualizacoes-windows
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install locked project (desk + dev extras)
        run: uv sync --extra desk --extra dev
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Read version from pyproject
        id: versao
        shell: pwsh
        run: |
          $v = uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "versao=$v" >> $env:GITHUB_OUTPUT
      - name: Build Executable Bundle
        run: uv run --with pyinstaller python -m desktop.packaging.build_exe
      - name: Prepare Authenticode certificate in ephemeral store
        id: code_signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $temCertificado = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $temSenha = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if (-not $temCertificado -and -not $temSenha) {
            if ($env:GITHUB_REF -like "refs/tags/v*") {
              throw "Release oficial exige certificado Authenticode no cofre do GitHub"
            }
            "available=false" >> $env:GITHUB_OUTPUT
            "status=UNSIGNED_TEST_ARTIFACT" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($temCertificado -xor $temSenha) {
            throw "Configuração Authenticode incompleta: certificado e senha devem existir juntos"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "dz23-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $senha = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $senha -Exportable:$false
            if (-not $cert -or -not $cert.HasPrivateKey) {
              throw "Certificado Authenticode não contém chave privada utilizável"
            }
            "available=true" >> $env:GITHUB_OUTPUT
            "status=SIGNED" >> $env:GITHUB_OUTPUT
            "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
            "pfx_path=$pfx" >> $env:GITHUB_OUTPUT
          } catch {
            if ($cert) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            throw
          }
      - name: Sign packaged application executable
        if: steps.code_signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe x64 não encontrado" }
          $arquivo = "dist\DZ23-Trading-AI\DZ23-Trading-AI.exe"
          & $signtool.FullName sign /sha1 "${{ steps.code_signing.outputs.thumbprint }}" /s My /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $arquivo
          if ($LASTEXITCODE -ne 0) { throw "assinatura do aplicativo falhou" }
          & $signtool.FullName verify /pa /all $arquivo
          if ($LASTEXITCODE -ne 0) { throw "verificação Authenticode do aplicativo falhou" }
      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $v = "${{ steps.versao.outputs.versao }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" desktop/installer/setup.iss
      - name: Sign installer
        if: steps.code_signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe x64 não encontrado" }
          $v = "${{ steps.versao.outputs.versao }}"
          $arquivo = "dist\DZ23-Trading-AI-Setup-v$v.exe"
          & $signtool.FullName sign /sha1 "${{ steps.code_signing.outputs.thumbprint }}" /s My /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $arquivo
          if ($LASTEXITCODE -ne 0) { throw "assinatura do instalador falhou" }
          & $signtool.FullName verify /pa /all $arquivo
          if ($LASTEXITCODE -ne 0) { throw "verificação Authenticode do instalador falhou" }
      - name: Zip Release Bundle and Calculate Hashes
        shell: pwsh
        run: |
          $v = "${{ steps.versao.outputs.versao }}"
          Compress-Archive -Path dist/DZ23-Trading-AI/* -DestinationPath dist/DZ23-Trading-AI-windows-x64.zip
          $linhas = foreach ($f in @("dist/DZ23-Trading-AI-Setup-v$v.exe", "dist/DZ23-Trading-AI-windows-x64.zip")) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          # Grava com finais de linha LF: `sha256sum -c` no Linux/macOS falha com CRLF.
          [System.IO.File]::WriteAllText("dist/SHA256SUMS.txt", ($linhas -join "`n"), [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText("dist/SIGNING_STATUS.txt", "${{ steps.code_signing.outputs.status }}`n", [System.Text.UTF8Encoding]::new($false))
      - name: Remove ephemeral signing material
        if: always() && steps.code_signing.outputs.available == 'true'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\${{ steps.code_signing.outputs.thumbprint }}" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "${{ steps.code_signing.outputs.pfx_path }}" -Force -ErrorAction SilentlyContinue
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dz23-windows-x64
          path: |
            dist/DZ23-Trading-AI-Setup-v*.exe
            dist/DZ23-Trading-AI-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/SIGNING_STATUS.txt
          if-no-files-found: error

  aceite-bundle:
    # V8 §4: "Não basta testar a API: executar E2E no bundle Windows
    # instalado" — a matriz de aceite TD-5 roda contra o ZIP do artefato,
    # extraído num ambiente isolado (runner virgem + APPDATA descartável).
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install locked project (desk + dev extras)
        run: uv sync --extra desk --extra dev
      - name: Install Playwright no venv do projeto
        run: uv pip install --python .venv/Scripts/python.exe playwright
      - name: Download artifact do bundle
        uses: actions/download-artifact@v8
        with:
          name: dz23-windows-x64
          path: artefato
      - name: Conferir hashes do artefato (SHA256SUMS)
        shell: bash
        working-directory: artefato
        run: sha256sum -c SHA256SUMS.txt
      - name: Extrair bundle (ambiente isolado)
        shell: pwsh
        run: Expand-Archive -Path artefato/DZ23-Trading-AI-windows-x64.zip -DestinationPath bundle -Force
      - name: Aceite E2E no bundle do artefato (matriz TD-5, navegador real)
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts\homolog_aceite_td5_bundle.py
          if ($LASTEXITCODE -ne 0) { throw "aceite no bundle falhou (exit $LASTEXITCODE)" }
      - name: Upload evidências do aceite no bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aceite-td5-bundle-evidencias
          path: docs/mission/evidence/v8-td5-exe/
          if-no-files-found: warn

  publish-release:
    # Publicação de Release só em tag explícita (aprovação humana = criar a tag).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, aceite-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dz23-windows-x64
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DZ23-Trading-AI-Setup-v*.exe
            dist/DZ23-Trading-AI-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/SIGNING_STATUS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
